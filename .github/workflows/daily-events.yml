name: Daily Event Sync

# Runs every day at 3:00 AM Nairobi time (EAT, UTC+3) = 0:00 UTC.
#
# Free-tier friendly design: instead of scraping multiple cities in one run
# (which blew past Gemini's free rate limit), the script itself picks ONE
# city based on the day of the week, so all 5 cities still get covered
# over the course of a week without needing a paid Gemini plan.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      city:
        description: "Force a specific city (e.g. Machakos:Kenya). Leave blank to use today's automatic rotation."
        required: false
        default: ""

jobs:
  sync-events:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run daily event sync
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVENT_CITIES: ${{ inputs.city }}
        run: python daily_event_sync.py