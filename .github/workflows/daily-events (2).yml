name: Daily Event Sync

# Runs every day at 3:00 AM Nairobi time (EAT, UTC+3) = 0:00 UTC.
#
# Free-tier friendly design: instead of scraping multiple cities in one run
# (which blew past Gemini's free rate limit), the script itself picks ONE
# city based on the day of the week, so all 5 cities still get covered
# over the course of a week without needing a paid Gemini plan.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  sync-events:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run daily event sync
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # No EVENT_CITIES set here on purpose — the script picks the
          # day's city automatically. Set it manually only when testing
          # a specific city via "Run workflow".
        run: python daily_event_sync.py
